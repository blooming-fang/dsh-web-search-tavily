# dsh-tavily-web-search — bundle patch layer
#
# Replaces the DeepSeek-backed search provider with a Tavily-backed one while
# keeping everything else (model-facing web_search tool, fetch, LLM, ...) intact.
#
# 1. Point ctx.web's searchProvider at this plugin's provider id (`tavily`).
#    The base layer sets `searchProvider: deepseek-official`; this later layer
#    overrides it. The bundled deepseek provider row stays mounted (harmless),
#    but the seam selects `tavily` for every web_search call.
# 2. Insert this plugin's row so its `apply` registers the provider.
#
# The row id is also this plugin's settings namespace: since DSH 0.1.7 a
# plugin's Config schema IS its configuration surface, so the settings domain
# serves the volatile fields of `web-search-tavily` to the browser without the
# plugin registering a namespace of its own. A later layer may restate the
# row's whole `config` (the key pool lives there) by targeting this id.

- id: web
  config:
    searchProvider: tavily

- insert:
    - id: web-search-tavily
      name: 'dsh-tavily-web-search'
